spring.application.name=product-service

server.port=8082

spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Local MySQL Database (Port 3306)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/smartshop?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Eureka Client Disabled for local standalone execution
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

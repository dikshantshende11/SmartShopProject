spring.application.name=user-service

server.port=${PORT:8081}

# View Resolver
spring.mvc.view.suffix=.jsp

# Database Configuration (Railway uses env vars, local uses defaults)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smartshop?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update  

# Eureka Client Disabled for standalone local execution
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
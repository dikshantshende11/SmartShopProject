spring.application.name=user-service

server.port=${PORT:8081}

# View Resolver
spring.mvc.view.suffix=.jsp

# Database Configuration (Railway/Render uses env vars, falls back to embedded H2 if MySQL is unavailable)
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:smartshop;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate (let Spring Boot auto-detect dialect based on JDBC driver)
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 console (disabled in production)
spring.h2.console.enabled=false

# Eureka Client Disabled for standalone local execution
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.application.name=user-service

server.port=8081

# View Resolver
spring.mvc.view.suffix=.jsp

# Local MySQL Database Configuration (Port 3306)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/smartshop?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update  

# Eureka Client Disabled for standalone local execution
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
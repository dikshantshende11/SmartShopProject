spring.application.name=order-service

server.port=${PORT:8083}

# Database Configuration (Railway/Render uses env vars, falls back to embedded H2 if MySQL is unavailable)
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:smartshop;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Disable Eureka Client for standalone cloud execution
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.enabled=false

# Disable mandatory Kafka auto-configuration for cloud deployment
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
spring.application.name=order-service

server.port=${PORT:8083}

# Database Configuration (Railway uses env vars, local uses defaults)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smartshop?createDatabaseIfNotExist=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Disable Eureka Client for standalone cloud execution
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.enabled=false

# Disable mandatory Kafka auto-configuration for cloud deployment
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration